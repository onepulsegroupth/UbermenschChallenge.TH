<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Ubermensch Challenge</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #000000, #071f21);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #ffffff;
    }

    /* กลางจอแนวตั้ง */
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* ภาพชนขอบ ไม่ครอป */
    .full-bleed {
      width: 100vw;
      height: auto;
      display: block;
    }

    .content {
      padding: 16px;
      text-align: center;
    }

    .text {
      font-size: 16px;
      line-height: 1.7;
      background: rgba(255,255,255,0.08);
      padding: 14px;
      border-radius: 12px;
      user-select: text;
      margin-top: 16px;
    }
  </style>
</head>

<body>

  <img
    src="QR1@144x.webp"
    alt="Ubermensch Challenge"
    class="full-bleed"
  >

  <div class="content">
    <div class="text">
      #ÜbermenschChallenge<br>
      #ÜbermenschChallenge_BANGKOK
    </div>
  </div>

</body>
</html>

<div id="toast">คัดลอกลิงก์แล้ว</div>

<style>
#toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.85);
  color: #fff;
  padding: 10px 16px;
  border-radius: 999px;
  opacity: 0;
  transition: opacity .3s;
}
#toast.show {
  opacity: 1;
}
</style>

<script>
function openAndCopy() {
  const url = "https://kittiphatramp-golf.github.io/UbermenschChallenge.TH/";
  navigator.clipboard.writeText(url);

  const toast = document.getElementById("toast");
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2000);

  window.open(url, "_blank");
}
</script>
